<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAME MODEL FC - 8-bit Match Engine</title>
<style>
  :root { --k:#0b0b14; --d:#1b2a4a; --w:#f2f0e6; --l:#c9c9c9; --m:#6b6b78; --y:#f5d33f; --g:#2f8a3a; --r:#d83a3a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--k); color: var(--w);
    font-family: ui-monospace, "Courier New", monospace; font-size: 13px; text-transform: uppercase; }
  #app { display: grid; grid-template-columns: 1fr 300px; grid-template-rows: 1fr auto; height: 100vh; gap: 8px; padding: 8px; }
  #stage { position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; overflow: hidden; }
  canvas#cv { image-rendering: pixelated; image-rendering: crisp-edges; display: block; background: var(--k); }
  #side { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .win { border: 3px solid var(--w); box-shadow: 3px 3px 0 var(--d); background: var(--k); display: flex; flex-direction: column; min-height: 0; }
  .wt { background: var(--w); color: var(--k); padding: 2px 6px; font-weight: bold; letter-spacing: 1px; }
  .wb { padding: 6px; overflow: auto; line-height: 1.45; }
  #logWin { flex: 1; } #log { flex: 1; white-space: pre-wrap; }
  #stats table, .ov table { width: 100%; border-collapse: collapse; }
  #stats td, .ov td, .ov th { padding: 1px 3px; }
  #stats td:nth-child(1), .ov td.l { text-align: right; } #stats td:nth-child(2) { text-align: center; color: var(--m); }
  #stats td:nth-child(3) { text-align: left; }
  #bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button, select { font: inherit; text-transform: uppercase; background: var(--d); color: var(--w); border: 2px solid var(--w);
    padding: 4px 8px; cursor: pointer; box-shadow: 2px 2px 0 var(--k); }
  button:hover, select:hover { background: var(--w); color: var(--k); }
  button.on { background: var(--y); color: var(--k); border-color: var(--y); }
  button:focus-visible, select:focus-visible { outline: 2px dashed var(--y); outline-offset: 2px; }
  .sep { width: 2px; height: 22px; background: var(--m); }
  .ov { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .ov .win { pointer-events: auto; max-width: 92%; max-height: 92%; }
  .ov .wb { min-width: 320px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  .row label { min-width: 110px; color: var(--l); }
  .muted { color: var(--m); } .hi { color: var(--y); }
  .bar { height: 8px; background: var(--d); border: 1px solid var(--m); margin: 6px 0; } .bar > div { height: 100%; background: var(--y); width: 0; }
  @media (max-width: 860px) { #app { grid-template-columns: 1fr; grid-template-rows: auto auto auto; height: auto; } #stage { min-height: 56vw; } #side { max-height: 60vh; } }
</style>
</head>
<body>
<div id="app">
  <main id="stage" aria-label="Match view">
    <canvas id="cv" width="336" height="240" role="img" aria-label="8-bit football pitch"></canvas>
    <div class="ov" id="overlay"></div>
  </main>
  <aside id="side">
    <section class="win" id="logWin"><div class="wt">Match log</div><div class="wb" id="log" aria-live="polite"></div></section>
    <section class="win"><div class="wt">Stats</div><div class="wb" id="stats"></div></section>
    <section class="win" id="decWin" hidden><div class="wt">Ball carrier brain</div><div class="wb" id="dec"></div></section>
  </aside>
  <nav id="bar" aria-label="Match controls">
    <button data-a="pause" id="bPause">Pause</button>
    <button data-a="sp" data-v="0.5">0.5x</button><button data-a="sp" data-v="1" class="on">1x</button>
    <button data-a="sp" data-v="2">2x</button><button data-a="sp" data-v="4">4x</button>
    <div class="sep"></div>
    <button data-a="restart">Restart</button><button data-a="menu">Menu</button>
    <button data-a="mute" id="bMute">SFX on</button>
    <div class="sep"></div>
    <span class="muted">Debug:</span>
    <button data-a="dbg" data-v="heat">Pitch ctrl</button><button data-a="dbg" data-v="tgt">Targets</button>
    <button data-a="dbg" data-v="dec">Decisions</button><button data-a="dbg" data-v="grid">Zones</button>
  </nav>
</div>
<script>
'use strict';
/* =====================================================================
   SECTION 0 - TUNING CONSTANTS  (everything that matters for feel/balance)
   ===================================================================== */
const CFG = {
  TEAM_SIZE: 7,            // 5, 7 or 11
  OFFSIDE: true,
  MATCH_REAL_MIN: 7,       // real minutes for 90 game minutes at 1x
  TICK_HZ: 10,             // fixed simulation rate
  PW: 105, PH: 68, GOAL_HALF: 3.66, GOAL_H: 2.44,
  BOX_D: 16.5, BOX_HALF: 20.16, SIX_D: 5.5, SIX_HALF: 9.16, PEN_D: 11, CIRCLE_R: 9.15,
  // ---- Ball ----
  G: 9.81,
  SUBSTEPS: 4,             // ball physics substeps per tick (catches fast shots crossing lines)
  ROLL_DECEL: 2.6,         // m/s^2 constant ground deceleration (rolling resistance + drag lumped)
  BOUNCE_REST: 0.45,       // vertical restitution on bounce
  BOUNCE_FRIC: 0.75,       // horizontal speed kept on bounce
  PASS_ARRIVE: 5.0,        // target speed of a ground pass when it reaches the receiver (m/s)
  PASS_MAX: 26,            // max kick speed for passes
  FOOT_H: 0.9, HEAD_H: 2.45, GK_HAND_H: 2.75,
  CONTROL_R: 1.0, AERIAL_R: 1.5,
  SHOT_SPEED: 23, SHOT_SPEED_VAR: 3,
  // ---- Players ----
  SPEED_BASE: 5.4, SPEED_PER_PACE: 0.14,   // vmax = base + pace*k  (pace 10 -> 6.8 m/s, 20 -> 8.2)
  ACCEL: 4.8, DECEL: 7.5,                  // m/s^2 (turning slowdown emerges from accel-limited steering)
  SEP_DIST: 1.1,
  DRIBBLE_FRAC: 0.82,                      // top speed fraction with ball at feet
  REACT_BASE: 0.38, REACT_PER_ANT: 0.012,  // reaction time = base - anticipation*k (s)
  DRAIN_BASE: 0.00003, DRAIN_SPRINT: 0.00018, RECOVER: 0.00001,  // energy per GAME second
  // ---- Decisions ----
  THINK_MIN: 0.3, THINK_MAX: 0.6,          // re-evaluation interval (s), faster with Decisions+Anticipation
  TEMP_BASE: 0.0035,                       // softmax temperature base (lower = more 'perfect' choices)
  VISION_R_BASE: 26, VISION_R_PER: 2.2,    // perception radius = base + vision*k (m)
  SHOT_MAX_DIST: 32, SHOT_BIAS: 1.5, LOSS_K: 1.0,
  // ---- Off-ball weights ----
  W_ANCHOR: 0.0015, W_LANE: 0.06, W_SPACE: 0.05, W_VALUE: 0.6, W_CROWD: 0.05,
  MARK_BLEND: 0.35,                        // 0 = pure zonal, 1 = pure man-orientation
  // ---- Duels / discipline ----
  TACKLE_RANGE: 1.5, TACKLE_BASE: 0.40, TACKLE_PER_DIFF: 0.032,
  FOUL_BASE: 0.025, YELLOW_P: 0.14, RED_P: 0.005,
  // ---- Goalkeeper ----
  GK_DIVE_BASE: 0.9, GK_DIVE_PER_REF: 0.075, GK_SAVE_BASE: 0.92,
};
const DT = 1 / CFG.TICK_HZ;
const PRED_DT = 0.1, PRED_STEPS = 32;

/* =====================================================================
   SECTION 1 - RNG & MATH
   ===================================================================== */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const hyp = Math.hypot;
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  const t = l2 ? clamp(((px - ax) * dx + (py - ay) * dy) / l2, 0, 1) : 0;
  return { d: hyp(px - ax - dx * t, py - ay - dy * t), t };
}

/* =====================================================================
   SECTION 2 - DATA: palette, font, teams, formations
   ===================================================================== */
const PAL = { K:'#0b0b14', D:'#1b2a4a', G1:'#2f8a3a', G2:'#277a32', W:'#f2f0e6', L:'#c9c9c9', M:'#6b6b78', R:'#d83a3a',
  O:'#f08a24', Y:'#f5d33f', B:'#2e7fd9', C:'#5fd3f2', S:'#f2b48a', T:'#9a5a3a', P:'#8a3fa0', N:'#3a2414' }; // 16 colours

// 3x5 bitmap font: each glyph = 5 rows, each row a digit 0-7 (bit 4 = left pixel)
const FONT = { '0':'75557','1':'26227','2':'71747','3':'71317','4':'55711','5':'74717','6':'74757','7':'71122','8':'75757','9':'75717',
  A:'25755',B:'65656',C:'34443',D:'65556',E:'74647',F:'74644',G:'34553',H:'55755',I:'72227',J:'11152',K:'55655',L:'44447',M:'57755',
  N:'65555',O:'25552',P:'65644',Q:'25563',R:'65655',S:'34216',T:'72222',U:'55557',V:'55552',W:'55775',X:'55255',Y:'55222',Z:'71247',
  ' ':'00000','.':'00002',',':'00024',':':'02020','-':'00700','!':'22202','?':'71202','%':'51245','/':'11244','(':'12221',')':'42224',
  "'":'22000','+':'02720','=':'07070','>':'42124','<':'12421','#':'57575' };

const ATTRS = ['pace','stamina','strength','passing','vision','dribbling','finishing','heading','tackling','positioning',
  'anticipation','composure','decisions','teamwork','discipline','reflexes','handling','distribution'];
const ROLE_TPL = {
  gk:  { pace:8, stamina:10, strength:12, passing:9, vision:9, dribbling:6, finishing:3, heading:6, tackling:6, positioning:13,
         anticipation:12, composure:12, decisions:12, teamwork:11, discipline:14, reflexes:14, handling:13, distribution:12 },
  def: { pace:11, stamina:12, strength:14, passing:10, vision:9, dribbling:8, finishing:5, heading:13, tackling:14, positioning:13,
         anticipation:12, composure:11, decisions:11, teamwork:12, discipline:12, reflexes:3, handling:3, distribution:5 },
  mid: { pace:12, stamina:14, strength:11, passing:14, vision:13, dribbling:12, finishing:9, heading:9, tackling:11, positioning:11,
         anticipation:12, composure:12, decisions:13, teamwork:13, discipline:12, reflexes:3, handling:3, distribution:5 },
  att: { pace:14, stamina:12, strength:12, passing:11, vision:11, dribbling:14, finishing:14, heading:12, tackling:6, positioning:12,
         anticipation:13, composure:12, decisions:11, teamwork:11, discipline:11, reflexes:3, handling:3, distribution:5 },
};
// Game-model "style" knobs (Phase 3 turns these into the full principle tree)
const PRESETS = [
  { id:'IRV', name:'IRONVALE FC', short:'IRV', personality:'PRESSING MANIAC', quality:0.5,
    kit:{ shirt:'R', shorts:'W', alt:'W', altShorts:'R', gk:'Y' },
    bias:{ stamina:2, pace:1, tackling:1, composure:-1 },
    style:{ block:'high', lineHeight:0.8, compact:0.75, pressIntensity:0.9, counterPress:4, tempo:0.85, directness:0.6, width:0.7, risk:0.65, buildUp:'mixed' } },
  { id:'SAL', name:'SALTMARSH ATH', short:'SAL', personality:'LOW BLOCK COUNTER', quality:0.5,
    kit:{ shirt:'B', shorts:'W', alt:'Y', altShorts:'B', gk:'P' },
    bias:{ strength:2, heading:2, positioning:2, pace:1, passing:-1 },
    style:{ block:'low', lineHeight:0.2, compact:0.9, pressIntensity:0.35, counterPress:0, tempo:0.8, directness:0.85, width:0.55, risk:0.55, buildUp:'direct' } },
  { id:'LUM', name:'LUMEN CITY', short:'LUM', personality:'POSSESSION PURIST', quality:0.5,
    kit:{ shirt:'O', shorts:'K', alt:'C', altShorts:'K', gk:'C' },
    bias:{ passing:2, vision:2, composure:2, dribbling:1, strength:-2, heading:-1 },
    style:{ block:'mid', lineHeight:0.55, compact:0.7, pressIntensity:0.6, counterPress:3, tempo:0.25, directness:0.2, width:1.0, risk:0.3, buildUp:'short' } },
];
const presetById = id => PRESETS.find(p => p.id === id) || PRESETS[0];

// Base shapes: line 0 GK, 1 defence, 2 midfield, 3 attack. y = lateral slot, dx = depth tweak (m)
const FORMATIONS = {
  5:  [{line:0,y:34,num:1},{line:1,y:22,num:4},{line:1,y:46,num:5},{line:2,y:34,num:8},{line:3,y:34,num:9}],
  7:  [{line:0,y:34,num:1},{line:1,y:23,num:4},{line:1,y:45,num:5},{line:2,y:11,num:7,dx:-2},{line:2,y:34,num:8,dx:-3},
       {line:2,y:57,num:11,dx:-2},{line:3,y:34,num:9}],
  11: [{line:0,y:34,num:1},{line:1,y:9,num:2,dx:2},{line:1,y:27,num:5},{line:1,y:41,num:4},{line:1,y:59,num:3,dx:2},
       {line:2,y:20,num:8},{line:2,y:34,num:6,dx:-4},{line:2,y:48,num:10},{line:3,y:11,num:7,dx:-3},{line:3,y:34,num:9},{line:3,y:57,num:11,dx:-3}],
};
const SYL = ['ka','to','ren','vel','mar','is','do','bra','lo','sen','ti','ko','va','ran','el','mo','dez','fi','gor','an','sa','lu','pe','tor','vin','ha','be','ro','ni','sk'];

function buildSquad(preset, size) {
  const rnd = mulberry32(hashStr(preset.id + size));
  return FORMATIONS[size].map((r, i) => {
    const key = r.line === 0 ? 'gk' : ['', 'def', 'mid', 'att'][r.line];
    const a = {};
    for (const k of ATTRS) a[k] = clamp(Math.round((ROLE_TPL[key][k] || 10) + (preset.bias[k] || 0) + preset.quality + (rnd() - 0.5) * 6), 1, 20);
    let name = ''; const n = 2 + (rnd() < 0.3 ? 1 : 0);
    for (let s = 0; s < n; s++) name += SYL[Math.floor(rnd() * SYL.length)];
    return { role: r, attrs: a, name: name.slice(0, 8).toUpperCase(), skin: rnd() < 0.5 ? 'S' : 'T', hair: ['N','K','Y','T'][Math.floor(rnd() * 4)] };
  });
}

/* =====================================================================
   SECTION 3 - MATCH STATE
   ===================================================================== */
const toA = (T, x) => T.dir === 1 ? x : CFG.PW - x;   // world x -> team attacking coords (0 = own goal line)
const fromA = toA;                                       // involution

function createMatch(o) {
  const size = o.size || CFG.TEAM_SIZE;
  const M = { tick: 0, clock: 0, half: 1, state: 'restart', over: false, size, offside: o.offside !== false,
    gsp: 5400 / ((o.realMin || CFG.MATCH_REAL_MIN) * 60 * CFG.TICK_HZ),   // game seconds per tick
    rnd: mulberry32(o.seed || 1), teams: [], players: [], events: [], log: [], possTeam: 0, pass: null, restart: null,
    pred: null, lastComp: null, lastDecision: null, shotId: 0, kickoffFirst: 0, headless: !!o.headless, xgLine: [] };
  M.gauss = () => { let u = 0; while (u === 0) u = M.rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * M.rnd()); };
  M.stoppage = [Math.floor(M.rnd() * 3) * 60 + 30, Math.floor(M.rnd() * 4) * 60 + 60];
  const presets = [presetById(o.home), presetById(o.away)];
  presets.forEach((pr, t) => {
    const kit = { ...pr.kit };
    if (t === 1 && pr.kit.shirt === presets[0].kit.shirt) { kit.shirt = pr.kit.alt; kit.shorts = pr.kit.altShorts; }
    if (t === 1 && kit.gk === presets[0].kit.gk) kit.gk = 'L';
    const T = { idx: t, preset: pr, name: pr.name, short: pr.short, style: { ...pr.style }, dir: t === 0 ? 1 : -1, kit, players: [],
      lossTick: -999, winTick: -999,
      stats: { goals:0, shots:0, sot:0, xg:0, passes:0, passComp:0, possTicks:0, tackles:0, tackWon:0, inter:0, fouls:0, yellows:0, reds:0,
        corners:0, offsides:0, press:0, ppdaPass:0, ppdaDef:0, saves:0 } };
    buildSquad(pr, size).forEach((s, i) => {
      const p = { id: t * 100 + i, team: t, idx: i, num: s.role.num, name: s.name, role: s.role, line: s.role.line, isGK: s.role.line === 0,
        a: s.attrs, skin: s.skin, hair: s.hair, x: 0, y: 0, vx: 0, vy: 0, px: 0, py: 0, fx: 1, fy: 0, energy: 1, tx: 0, ty: 0, urg: 0.5,
        think: 0, mode: '', task: 'shape', kickCd: 0, tackleCd: 0, stun: 0, active: true, yellow: 0, anim: 0, holding: false, saveTried: -1,
        st: { goals:0, assists:0, shots:0, xg:0, passes:0, passComp:0, tackles:0, tackWon:0, inter:0, fouls:0, saves:0, dist:0, touches:0, conceded:0 } };
      T.players.push(p); M.players.push(p);
    });
    M.teams.push(T);
  });
  M.ball = { x: 52.5, y: 34, z: 0, vx: 0, vy: 0, vz: 0, px: 52.5, py: 34, pz: 0, owner: null, lastTouch: null, shot: null };
  setKickoff(M, 0);
  logEvt(M, `KICK OFF: ${M.teams[0].name} V ${M.teams[1].name}`);
  emit(M, 'whistle', { n: 1 });
  return M;
}
function emit(M, type, data) { if (!M.headless) M.events.push({ type, ...data }); }
function minuteStr(M) {
  const c = M.clock;
  if (M.half === 1 && c >= 2700) return `45+${Math.floor((c - 2700) / 60) + 1}'`;
  if (M.half === 2 && c >= 5400) return `90+${Math.floor((c - 5400) / 60) + 1}'`;
  return `${Math.floor(c / 60) + 1}'`;
}
function logEvt(M, txt) { const s = `${minuteStr(M).padStart(5)} ${txt}`; M.log.push(s); emit(M, 'log', { text: s }); }

/* =====================================================================
   SECTION 4 - BALL PHYSICS
   ===================================================================== */
function stepBall(b, h) {
  if (b.z > 0 || b.vz > 0) {                       // airborne: parabola, no drag (keeps predictions exact)
    b.vz -= CFG.G * h; b.x += b.vx * h; b.y += b.vy * h; b.z += b.vz * h;
    if (b.z <= 0) {
      b.z = 0;
      if (-b.vz > 1.2) { b.vz = -b.vz * CFG.BOUNCE_REST; b.vx *= CFG.BOUNCE_FRIC; b.vy *= CFG.BOUNCE_FRIC; } else b.vz = 0;
    }
  } else {                                          // rolling: constant deceleration  v(t) = v0 - a*t
    const sp = hyp(b.vx, b.vy);
    if (sp > 0) { const ns = Math.max(0, sp - CFG.ROLL_DECEL * h), k = ns / sp; b.vx *= k; b.vy *= k; }
    b.x += b.vx * h; b.y += b.vy * h;
  }
}
function predictBall(b) {
  const q = { x: b.x, y: b.y, z: b.z, vx: b.vx, vy: b.vy, vz: b.vz }, out = [{ x: q.x, y: q.y, z: q.z }];
  for (let k = 1; k <= PRED_STEPS; k++) { stepBall(q, PRED_DT / 2); stepBall(q, PRED_DT / 2); out.push({ x: q.x, y: q.y, z: q.z }); }
  return out;
}
// Analytic ground-pass kinematics: v0 so that ball arrives with PASS_ARRIVE after distance d
const groundV0 = d => Math.sqrt(CFG.PASS_ARRIVE ** 2 + 2 * CFG.ROLL_DECEL * d);
const groundTimeAt = (v0, s) => (v0 - Math.sqrt(Math.max(0, v0 * v0 - 2 * CFG.ROLL_DECEL * s))) / CFG.ROLL_DECEL;
const loftTime = d => clamp(0.7 + d / 24, 0.9, 2.6);

/* =====================================================================
   SECTION 5 - PLAYER HELPERS, PERCEPTION, VALUE MODELS
   ===================================================================== */
const maxSpeedFresh = p => CFG.SPEED_BASE + p.a.pace * CFG.SPEED_PER_PACE;
function maxSpeed(p) { return maxSpeedFresh(p) * (0.72 + 0.28 * p.energy) * (p.stun > 0 ? 0.35 : 1) * (p.isGK ? 0.9 : 1); }
const reactTime = p => CFG.REACT_BASE - p.a.anticipation * CFG.REACT_PER_ANT;
function timeTo(p, x, y, r) { const d = Math.max(0, hyp(x - p.x, y - p.y) - (r || 0)); return reactTime(p) + d / maxSpeed(p) + (d > 1 ? 0.25 : 0); }
const opp = (M, p) => M.teams[1 - p.team];
const actives = T => T.players.filter(p => p.active);
function inOwnBox(M, p) { const T = M.teams[p.team], ax = toA(T, p.x); return ax < CFG.BOX_D + 0.5 && ax > -1 && Math.abs(p.y - 34) < CFG.BOX_HALF; }
function inBoxOf(T, x, y) { const ax = toA(T, x); return ax < CFG.BOX_D && Math.abs(y - 34) < CFG.BOX_HALF; }

// Expected Possession Value (attacking coords) = P(goal from this possession state).
// ~0.012 own third, ~0.026 halfway, ~0.065 at 21m, ~0.115 penalty spot, ~0.16 six-yard box
function epvA(ax, y) {
  const dx = 105 - ax, dy = y - 34, d = Math.sqrt(dx * dx + dy * dy);
  const central = 1 - Math.min(1, Math.abs(dy) / 34) * 0.35;
  return (0.004 + 0.0004 * clamp(ax, 0, 105) + 0.22 * Math.exp(-d / 10)) * central;
}
// xG = logistic(-(1 + 0.11*dist - 1.25*goalAngle))  -> ~0.20 from penalty spot, ~0.43 from 6m central, ~0.06 at 20m
function xgBase(ax, y) {
  const dx = Math.max(0.3, 105 - ax);
  const ang = Math.abs(Math.atan2(34 + CFG.GOAL_HALF - y, dx) - Math.atan2(34 - CFG.GOAL_HALF - y, dx));
  return 1 / (1 + Math.exp(1.0 + 0.11 * hyp(dx, y - 34) - 1.25 * ang));
}
function pressureOn(M, p) {
  let d1 = 99, n = 0;
  for (const q of opp(M, p).players) { if (!q.active) continue; const d = hyp(q.x - p.x, q.y - p.y); if (d < d1) d1 = d; if (d < 4) n++; }
  return clamp((5.5 - d1) / 4.5 + (n > 1 ? 0.2 : 0), 0, 1);
}
function canSee(p, q) {
  const dx = q.x - p.x, dy = q.y - p.y, d = hyp(dx, dy);

      }
      drainEvents(M);
    } else if (M) drainEvents(M);
    render(ctx, M, ui, M && !ui.paused ? clamp(ui.acc / DT, 0, 1) : 1);
    if (M && now - statT > 500) {
      statT = now; $stats.innerHTML = statsTable(M);
      if (ui.debug.dec && M.lastDecision) {
        const d = M.lastDecision, T = M.teams[d.p.team];
        $dec.innerHTML = `<div class="hi">${T.short} #${d.p.num} ${d.p.name}</div>` + d.opts.map(o => {
          const lbl = o.type === 'pass' ? `${o.kind} > #${o.recv ? o.recv.num : '--'}` : o.type;
          return `<div${o === d.pick ? ' class="hi"' : ''}>${lbl.padEnd(14)} P${o.p.toFixed(2)} U${(o.u * 100).toFixed(1)} ${(o.w / d.sum * 100).toFixed(0)}%</div>`;
        }).join('');
      }
    }
    requestAnimationFrame(frame);
  }
  showTitle();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
